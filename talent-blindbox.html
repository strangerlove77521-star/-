<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<title>反差天赋盲盒</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
body { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); color: #fff; display: flex;
    justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 15px; }
#app { background: rgba(20,20,30,.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.1); width: 100%; max-width: 420px; border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.6); overflow: hidden; padding: 25px 20px 18px; }
.screen { display: none; animation: fadeIn .5s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.progress-container { width: 100%; height: 3px; background: #333; border-radius: 2px; margin-bottom: 14px; display: none; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe); border-radius: 2px; width: 0; transition: width .3s ease; }
.qno { font-size: 12px; color: #7d86a8; margin-bottom: 10px; letter-spacing: 1px; }

.title { text-align: center; font-size: 26px; font-weight: 900; background: linear-gradient(90deg, #00f2fe, #4facfe);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 14px; letter-spacing: 2px; }
.subtitle { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 22px; line-height: 1.9; }
.facts { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
.facts span { font-size: 12px; color: #4facfe; border: 1px solid rgba(79,172,254,.4); border-radius: 12px; padding: 3px 10px; }
.btn { display: block; width: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); color: #001; border: none;
    padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: all .2s; text-align: center; margin-top: 12px; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: #4facfe; border: 1px solid rgba(79,172,254,.5); }

.question-title { font-size: 17px; font-weight: bold; margin-bottom: 18px; line-height: 1.55; color: #eee; }
.options { display: flex; flex-direction: column; gap: 11px; }
.option { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); padding: 14px; border-radius: 10px;
    font-size: 14px; cursor: pointer; transition: all .2s; color: #ccc; line-height: 1.45; }
.option:active { background: rgba(255,255,255,.1); }
.option.selected { background: rgba(79,172,254,.2); border-color: #4facfe; color: #fff; }

.loading-container { text-align: center; padding: 44px 0; }
.radar { width: 64px; height: 64px; border: 2px solid #4facfe; border-radius: 50%; margin: 0 auto 22px; position: relative; overflow: hidden; animation: pulse 1.5s infinite; }
.radar::after { content: ''; position: absolute; inset: 0; background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, rgba(79,172,254,.6) 360deg); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.loading-text { color: #4facfe; font-size: 14px; letter-spacing: 1px; }

.result-header { text-align: center; margin-bottom: 14px; }
.result-badge { display: inline-block; background: #2a2a3a; color: #00f2fe; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.rarity { display: inline-block; margin-left: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 900; letter-spacing: 1px; }
.rarity.SSR { background: linear-gradient(90deg, #ffd34e, #ff8a3d); color: #3a1d00; }
.rarity.SR  { background: linear-gradient(90deg, #c58bff, #7f8cff); color: #190a38; }
.rarity.R   { background: #3b4261; color: #cfd6ff; }
.reveal-tag { font-size: 12px; color: #7f8cff; margin: 0 0 6px 2px; }
.talent-box { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 14px 15px; margin-bottom: 10px; }
.talent-box .theme { float: right; font-size: 11px; color: #8a93b8; border: 1px solid rgba(255,255,255,.12); padding: 1px 8px; border-radius: 10px; }
.talent-idiom { font-size: 21px; font-weight: 900; color: #00f2fe; display: inline-block; margin-bottom: 8px; border-bottom: 2px dashed #555; padding-bottom: 2px; }
.talent-desc { font-size: 14px; color: #bbb; line-height: 1.55; }
.vs-container { text-align: center; margin: -2px 0 6px; position: relative; z-index: 2; }
.vs-badge { display: inline-block; background: linear-gradient(90deg, #4facfe, #00f2fe); color: #001; font-weight: bold; font-size: 13px; width: 32px; height: 32px; line-height: 32px; border-radius: 50%; box-shadow: 0 0 10px rgba(79,172,254,.5); }
.combo-analysis { background: rgba(79,172,254,.1); border-left: 4px solid #4facfe; padding: 14px; border-radius: 0 10px 10px 0; margin: 12px 0 6px; }
.combo-analysis h4 { color: #4facfe; font-size: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.combo-analysis h4 em { font-style: normal; font-size: 12px; color: #00f2fe; border: 1px solid rgba(0,242,254,.4); padding: 1px 8px; border-radius: 10px; }
.combo-analysis p { color: #ddd; font-size: 14px; line-height: 1.75; white-space: pre-line; }
.row2 { display: flex; gap: 10px; }
.row2 .btn { flex: 1; }
.disclaimer { text-align: center; font-size: 11px; color: #667; margin-top: 14px; }

#share-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 99; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
#share-mask.show { display: flex; }
#share-img { max-width: 100%; max-height: 78vh; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#share-mask p { color: #fff; font-size: 14px; margin: 14px 0 10px; }
#share-mask button { background: #fff; border: none; border-radius: 20px; padding: 9px 26px; font-size: 14px; color: #302b63; font-weight: 700; }
</style>
</head>
<body>

</div>

<script>
// ===== 可自定义配置 =====
const CONFIG = {
  brand: ""   // 例如 "小红书 @你的昵称"，会显示在分享图底部；留空则显示默认文案
};

const $ = id => document.getElementById(id);
const SCREENS = ['start-screen', 'quiz-screen', 'loading-screen', 'result-screen'];
function show(id) { SCREENS.forEach(s => $(s).classList.toggle('active', s === id)); window.scrollTo(0, 0); }

function hash32(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  h ^= h >>> 16; h = Math.imul(h, 2246822507) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 3266489909) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

// ===== 50 个天赋：[名称, 主题, 极性(0/1), 描述, 短语(用于解析)] =====

const T = RAW.map(([idiom, theme, pole, desc, short]) => ({ idiom, theme, pole, desc, short }));
const byName = Object.fromEntries(T.map(t => [t.idiom, t]));
const pool = (theme, pole) => T.filter(t => t.theme === theme && t.pole === pole);

// 反差候选：同主题、相反极性，最强搭档排第一
function oppositeList(t) {
  const same = pool(t.theme, t.pole), opp = pool(t.theme, 1 - t.pole);
  const partner = opp[same.indexOf(t)];
  return [partner].concat(opp.filter(x => x !== partner));
}

const SPECIAL = {

const CLOSERS = ['反差越大，越有魅力。', '建议保持，千万别被矫正。', '别怕矛盾，矛盾才是你的出厂设置。',
  '能同时住下两个你，说明你的内心很宽敞。', '这届反差，稳了。', '朋友们看到的，只是冰山一角。'];

// ===== 状态与流程 =====
const state = { idx: 0, picks: [], reroll: 0, result: null };
let locked = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQuiz() {
  state.idx = 0; state.picks = []; state.reroll = 0; state.result = null;
  $('progress-container').style.display = 'block';
  $('progress-bar').style.width = '0%';
  show('quiz-screen'); renderQ();
}
function renderQ() {
  const q = QS[state.idx]; locked = false;
  $('qno').textContent = '第 ' + (state.idx + 1) + ' / ' + QS.length + ' 题';
  $('question-title').textContent = q.q;
  $('progress-bar').style.width = (state.idx / QS.length * 100) + '%';
  const box = $('options-container'); box.innerHTML = '';
  shuffle(q.o.map((o, i) => ({ text: o[0], i }))).forEach(opt => {
    const div = document.createElement('div');
    div.className = 'option'; div.textContent = opt.text;
    div.addEventListener('click', () => pick(div, opt.i));
    box.appendChild(div);
  });
}
function pick(el, i) {
  if (locked) return; locked = true;
  el.classList.add('selected'); state.picks.push(i);
  setTimeout(() => {
    state.idx++;
    if (state.idx < QS.length) renderQ();
    else { $('progress-bar').style.width = '100%'; showLoading(); }
  }, 220);
}
function showLoading() {
  show('loading-screen');
  const texts = ['正在扫描反差基因...', '寻找互相打架的天赋...', '生成你的双拼卡牌...'];
  let k = 0;
  const timer = setInterval(() => { k = (k + 1) % texts.length; $('loading-text').textContent = texts[k]; }, 700);
  setTimeout(() => { clearInterval(timer); compute(); renderResult(); $('progress-container').style.display = 'none'; show('result-screen'); }, 2200);
}

function compute() {
  const seed = state.picks.join('');
  const score = {}; T.forEach(t => score[t.idiom] = 0);
  state.picks.forEach((pi, qi) => QS[qi].o[pi][1].forEach(n => score[n]++));
  const max = Math.max(...Object.values(score));
  const tied = T.filter(t => score[t.idiom] === max);
  // 同分时用答案做种子稳定选择：同样的答案永远得到同样的主天赋
  tied.sort((a, b) => hash32(seed + a.idiom) - hash32(seed + b.idiom));
  state.main = tied[0]; state.seed = seed;
}
function currentResult() {
  const main = state.main, seed = state.seed;
  const cands = oppositeList(main);
  const h = hash32(seed + '#sub');
  const base = (h % 10 < 4) ? 0 : 1 + ((h >>> 4) % 4);        // 40% 概率抽到最强搭档
  const sub = cands[(base + state.reroll) % cands.length];
  const key1 = main.idiom + '|' + sub.idiom, key2 = sub.idiom + '|' + main.idiom;
  const closer = CLOSERS[hash32(seed + sub.idiom + '#c') % CLOSERS.length];
  const text = SPECIAL[key1] || SPECIAL[key2] ||
    ('别人眼里，你是【' + main.idiom + '】：' + main.short + '。\n' +
     '但只有你自己知道，心里还住着一位【' + sub.idiom + '】：' + sub.short + '。\n' + closer);
  const contrast = 72 + (hash32(seed + sub.idiom + '#ct') % 28);
  const r = hash32(seed + sub.idiom + '#rar') % 100;
  const rarity = r < 8 ? 'SSR' : r < 35 ? 'SR' : 'R';
  return { main, sub, text, contrast, rarity };
}
function renderResult() {
  const r = state.result = currentResult();
  $('talent1-idiom').textContent = '【' + r.main.idiom + '】';
  $('talent1-desc').textContent = r.main.desc;
  $('theme1').textContent = THEMES[r.main.theme];
  $('talent2-idiom').textContent = '【' + r.sub.idiom + '】';
  $('talent2-desc').textContent = r.sub.desc;
  $('theme2').textContent = THEMES[r.sub.theme];
  $('combo-desc').textContent = r.text;
  $('contrast').textContent = '反差指数 ' + r.contrast + '%';
  const rar = $('rarity'); rar.textContent = r.rarity; rar.className = 'rarity ' + r.rarity;
}
function reroll() {
  state.reroll++;
  const app = $('result-screen'); app.style.animation = 'none'; void app.offsetWidth; app.style.animation = '';
  renderResult();
}
function restart() {
  $('progress-container').style.display = 'none';
  $('progress-bar').style.width = '0%';
  show('start-screen');
}

// ===== 分享图 =====
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Heiti SC",sans-serif';
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    let line = '';
    for (const ch of par) {
      const t = line + ch;
      if (ctx.measureText(t).width > maxW && line && !'。，、；：！？”’）》…'.includes(ch)) { out.push(line); line = ch; } else line = t;
    }
    out.push(line);
  });
  return out;
}
function drawCardH(r, H) {
  const W = 750, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0f0c29'); bg.addColorStop(.5, '#302b63'); bg.addColorStop(1, '#24243e');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(20,20,34,.88)'; rr(ctx, 40, 50, 670, H - 100, 36); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const tg = ctx.createLinearGradient(200, 0, 550, 0); tg.addColorStop(0, '#00f2fe'); tg.addColorStop(1, '#4facfe');
  ctx.fillStyle = tg; ctx.font = 'bold 48px ' + FONT; ctx.fillText('反差天赋盲盒', W / 2, 140);
  ctx.fillStyle = r.rarity === 'SSR' ? '#ffd34e' : r.rarity === 'SR' ? '#b79bff' : '#aab4ff';
  ctx.font = 'bold 30px ' + FONT; ctx.fillText('稀有度 ' + r.rarity + ' · 反差指数 ' + r.contrast + '%', W / 2, 192);

  function box(y, label, t) {
    ctx.font = '27px ' + FONT;
    const lines = wrap(ctx, t.desc, 560);
    const h = 40 + 30 + 66 + lines.length * 42 + 22;
    ctx.fillStyle = 'rgba(255,255,255,.06)'; rr(ctx, 75, y, 600, h, 22); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#7f8cff'; ctx.font = '24px ' + FONT; ctx.fillText(label, 105, y + 46);
    ctx.textAlign = 'right'; ctx.fillStyle = '#8a93b8'; ctx.fillText(THEMES[t.theme], 645, y + 46);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#00f2fe'; ctx.font = 'bold 50px ' + FONT; ctx.fillText('【' + t.idiom + '】', 105, y + 114);
    ctx.fillStyle = '#c4c8d8'; ctx.font = '27px ' + FONT;
    lines.forEach((l, i) => ctx.fillText(l, 105, y + 164 + i * 42));
    return y + h;
  }
  let y = box(235, '👀 别人眼里的你', r.main);
  ctx.textAlign = 'center'; ctx.fillStyle = '#4facfe'; ctx.beginPath(); ctx.arc(W / 2, y + 34, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#001'; ctx.font = 'bold 24px ' + FONT; ctx.fillText('VS', W / 2, y + 43);
  y = box(y + 78, '🫥 只有你自己知道的你', r.sub);

  y += 40;
  ctx.font = '27px ' + FONT;
  const lines = wrap(ctx, r.text, 560);
  const ch = 70 + lines.length * 46 + 20;
  ctx.fillStyle = 'rgba(79,172,254,.12)'; rr(ctx, 75, y, 600, ch, 20); ctx.fill();
  ctx.fillStyle = '#4facfe'; ctx.fillRect(75, y + 10, 6, ch - 20);
  ctx.textAlign = 'left'; ctx.fillStyle = '#4facfe'; ctx.font = 'bold 29px ' + FONT; ctx.fillText('🔮 反差解析报告', 105, y + 50);
  ctx.fillStyle = '#e6e8f2'; ctx.font = '27px ' + FONT;
  lines.forEach((l, i) => ctx.fillText(l, 105, y + 104 + i * 46));

  ctx.textAlign = 'center'; ctx.fillStyle = '#cfd6ff'; ctx.font = '25px ' + FONT;
  ctx.fillText(CONFIG.brand || '来测测你体内两种天赋怎么打架', W / 2, H - 105);
  ctx.fillStyle = '#7d86a8'; ctx.font = '20px ' + FONT; ctx.fillText('仅供娱乐 · 结果随机生成', W / 2, H - 70);
  cv.endY = y + ch;
  return cv;
}
function drawCard(r) {
  const probe = drawCardH(r, 1900);
  return drawCardH(r, Math.min(1900, probe.endY + 175));
}
function openShare() {
  if (!state.result) return;
  try {
    $('share-img').src = drawCard(state.result).toDataURL('image/png');
    $('share-mask').classList.add('show');
  } catch (e) { alert('生成分享图失败，请截图保存～'); }
}

$('btn-start').addEventListener('click', startQuiz);
$('btn-reroll').addEventListener('click', reroll);
$('btn-share').addEventListener('click', openShare);
$('btn-restart').addEventListener('click', restart);
$('share-close').addEventListener('click', () => $('share-mask').classList.remove('show'));
$('share-mask').addEventListener('click', e => { if (e.target.id === 'share-mask') $('share-mask').classList.remove('show'); });
